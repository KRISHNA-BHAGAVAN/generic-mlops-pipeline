# =============================================================================
# Prometheus Cloud Mode Configuration
# =============================================================================
# Use this config instead of prometheus.yml when forwarding metrics to
# Grafana Cloud.  Prometheus auto-selects this config when
# GRAFANA_CLOUD_PROM_URL is set in .env.
#
# Prerequisites:
#   1. Set GRAFANA_CLOUD_PROM_URL and GRAFANA_CLOUD_PROM_USERNAME in .env
#   2. Place your Grafana Cloud API token in:
#      .secrets/grafana_cloud_metrics_token
#   3. Restart docker compose: docker compose -f deployment/docker-compose.yml up -d
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "mlops-pipeline"
    env: "dev"
    developer: "${PROMETHEUS_DEVELOPER}"

# ── Remote Write to Grafana Cloud ──────────────────────────────────────────
remote_write:
  - url: "${GRAFANA_CLOUD_PROM_URL}"
    basic_auth:
      username: "${GRAFANA_CLOUD_PROM_USERNAME}"
      password_file: /run/secrets/grafana_cloud_metrics_token

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load alert rules
rule_files:
  - "prometheus.rules.yml"

scrape_configs:
  # FastAPI inference service
  - job_name: "fastapi-service"
    static_configs:
      - targets: ["fastapi:8000"]
    metrics_path: "/metrics"
    scrape_interval: 15s

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Pushgateway (batch monitoring metrics)
  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
