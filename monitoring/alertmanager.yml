global:
  resolve_timeout: 5m

route:
  receiver: "default"
  group_by: ["alertname", "component"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h

receivers:
  - name: "default"
    # Console/webhook receiver (default — no external dependencies)
    webhook_configs: []
    slack_configs:
      # Keep Slack webhook out of git by mounting it as a secret file.
      # Create locally:
      #   echo "https://hooks.slack.com/services/..." > .secrets/slack_webhook_url
      - api_url_file: /run/secrets/slack_webhook_url
        channel: "#ml-alerts"
        title: "{{ .GroupLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}{{ end }}"
