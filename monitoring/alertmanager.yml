global:
  resolve_timeout: 5m

route:
  receiver: "default"
  group_by: ["alertname", "component"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h

receivers:
  - name: "default"
    # Console/webhook receiver (default — no external dependencies)
    webhook_configs: []
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL:-}"
        channel: "#ml-alerts"
        title: "{{ .GroupLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}{{ end }}"
