[project]
name = "generic-mlops-pipeline"
version = "0.1.0"
description = "A production-ready, config-driven MLOps pipeline with integrated observability"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core ML
    "scikit-learn>=1.8.0",
    "pandas>=2.3.3",
    "numpy>=2.4.4",
    # Config & Validation
    "pydantic>=2.0.0",
    "pyyaml>=6.0.3",
    # Experiment Tracking
    "mlflow>=3.10.1",
    # Data Versioning
    "dvc>=3.67.1",
    # Serving
    "fastapi>=0.135.3",
    "uvicorn>=0.43.0",
    # CLI
    "click>=8.1.0",
    # Monitoring
    "prometheus-client>=0.21.0",
    # Drift Detection
    "evidently>=0.6.0",
    # HTTP client (for traffic generation)
    "httpx>=0.27.0",
    # Scheduling (for batch monitoring)
    "apscheduler>=3.10.0",
    # Timezone support (required by APScheduler 3.x for explicit UTC)
    "pytz>=2024.1",
    # Database (PostgreSQL via SQLAlchemy Core)
    "sqlalchemy>=2.0",
    "psycopg[binary]",
    # Plotting (for evaluation artifacts)
    "matplotlib>=3.9.0",
    # Environment variables
    "python-dotenv>=1.0.0",
    "dagshub>=0.6.9",
    "dvc-s3>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generic-mlops-pipeline"]
