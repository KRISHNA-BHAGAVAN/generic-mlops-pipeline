services:
  # ─── PostgreSQL (Shared State) ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-mlops}
      POSTGRES_USER: ${DB_USER:-mlops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mlops}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mlops
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mlops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Inference Service ───────────────────────────────────────────
  fastapi:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      APP_PORT: 8000
      LOG_LEVEL: INFO
    volumes:
      - ../src:/app/src
      - ../deployment/app.py:/app/deployment/app.py
    networks:
      - mlops
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
    restart: unless-stopped

  # ─── Prometheus (Metrics Collection) ─────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus.rules.yml:/etc/prometheus/prometheus.rules.yml:ro
      # Grafana Cloud remote_write token (local secret; gitignored)
      - ../.secrets/grafana_cloud_metrics_token:/run/secrets/grafana_cloud_metrics_token:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--enable-feature=expand-external-labels"
    environment:
      PROMETHEUS_DEVELOPER: ${PROMETHEUS_DEVELOPER:-anonymous}
    networks:
      - mlops
    restart: unless-stopped

  # ─── Grafana (Visualization) ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - mlops
    depends_on:
      - prometheus
    restart: unless-stopped

  # ─── Alertmanager (Alert Routing) ────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - mlops
    restart: unless-stopped

  # ─── Prometheus Pushgateway (Batch Metrics) ──────────────────────────────
  pushgateway:
    image: prom/pushgateway:latest
    ports:
      - "9091:9091"
    networks:
      - mlops
    restart: unless-stopped

  # ─── Prometheus Cloud Mode (Grafana Cloud) ───────────────────────────────
  # Use this profile for shared dashboards via Grafana Cloud:
  #   docker compose --profile cloud up -d
  prometheus-cloud:
    image: prom/prometheus:latest
    profiles:
      - cloud
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.cloud.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus.rules.yml:/etc/prometheus/prometheus.rules.yml:ro
      - ../.secrets/grafana_cloud_metrics_token:/run/secrets/grafana_cloud_metrics_token:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--enable-feature=expand-external-labels"
    environment:
      PROMETHEUS_DEVELOPER: ${PROMETHEUS_DEVELOPER:-anonymous}
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL}
      GRAFANA_CLOUD_PROM_USERNAME: ${GRAFANA_CLOUD_PROM_USERNAME}
    networks:
      - mlops
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  mlops:
    driver: bridge
