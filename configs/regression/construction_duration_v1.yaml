# ─────────────────────────────────────────────────────────────
# Experiment: Predict construction task duration (regression)
# Dataset: Construction project tasks
# ─────────────────────────────────────────────────────────────

experiment_name: "construction_duration_rf_v1"
user: "krishna"

# Task definition
task_type: "regression"
target_column: "Task_Duration_Days"
feature_columns:
  - "Labor_Required"
  - "Equipment_Units"
  - "Material_Cost_USD"
  - "Start_Constraint"
  - "Resource_Constraint_Score"
  - "Site_Constraint_Score"
  - "Dependency_Count"

# Dataset
dataset_source: "data/raw/construction_dataset.csv"

# Model
model_type: "random_forest_regression"
model_params:
  n_estimators: 100
  max_depth: 10
  min_samples_split: 5
  random_state: 42

# Preprocessing
preprocessing:
  - type: "normalize"
    columns:
      - "Material_Cost_USD"
      - "Start_Constraint"

# Splitting
split_strategy: "random"
test_size: 0.2
random_state: 42

# Metrics
metrics:
  - "mse"
  - "rmse"
  - "mae"
  - "r2"

# Registry
registry_name: "construction_duration"
serialization_format: "skops"  # valid: "cloudpickle", "pickle", "skops"

# MLflow Optional Metadata
experiment_description: "Baseline regression experiment for construction task duration forecasting"
experiment_tags:
  user: "krishna"
  project: "generic-mlops-pipeline"
mlflow_tags:
  team: "engineering"
  priority: "high"
  model_family: "random_forest"
run_name: "duration-rf-baseline-v1"
run_description: "Tracks baseline RF model with explicit dataset lineage metadata"
dataset_name: "Testing-dataset"
dataset_source_uri: "https://dagshub.com/krishnabhagavan910/generic-mlops-pipeline/src/2af4d0aec5ac7b88f92ebba2e768cdd6095eeac0/data/raw/construction_dataset.csv"
dataset_context: "training"
dataset_tags:
  split: "train+test from raw csv"
  data_owner: "engineering"

